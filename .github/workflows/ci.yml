name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # Unit tests of the toolbox scripts (etb, esgf-toolbox-versions), on the host: no image build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # publishes no moving major tag
      - run: make unit
